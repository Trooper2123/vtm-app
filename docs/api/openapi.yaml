openapi: 3.1.0
info:
  title: VTM App API
  version: 1.0.0
  description: API separada do frontend para o fluxo de perfil e demais módulos migrados.
servers:
  - url: https://{api-host}
    variables:
      api-host:
        default: api.example.com
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Verifica a disponibilidade da API
      tags: [Health]
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    example: vtm-app-api
                  timestamp:
                    type: string
                    format: date-time
  /api/v1/profile:
    get:
      operationId: getOwnProfile
      summary: Consulta o perfil do usuário autenticado
      description: A identidade é obtida do subject do token Auth0 validado. Nunca aceita subject por parâmetro.
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil encontrado
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: O usuário autenticado ainda não criou perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createOwnProfile
      summary: Cria o perfil do usuário autenticado
      description: Criação única por subject Auth0. A repetição retorna 409 e não sobrescreve o perfil.
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Perfil criado
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Campos ausentes ou inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Perfil já existe para a identidade Auth0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required: [name, email, accountType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        nickname:
          type: string
          maxLength: 40
        pronouns:
          type: string
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 320
        accountType:
          type: string
          enum: [player, game_master, both]
    Profile:
      type: object
      required: [name, nickname, pronouns, email, accountType, createdAt, updatedAt]
      properties:
        name:
          type: string
        nickname:
          type: [string, "null"]
        pronouns:
          type: [string, "null"]
        email:
          type: string
          format: email
        accountType:
          type: string
          enum: [player, game_master, both]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Erro interno ou configuração de dependência ausente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
