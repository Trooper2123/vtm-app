openapi: 3.1.0
info:
  title: VTM App API
  version: 1.0.0
  description: API separada do frontend para o fluxo de perfil e demais módulos migrados.
servers:
  - url: https://{api-host}
    variables:
      api-host:
        default: api.example.com
paths:
  /api/v1/me/characters:
    get:
      summary: Lista vampiros próprios
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        "200": { description: Lista characters e nextOffset; ordenação por created_at e id. }
        default: { $ref: '#/components/responses/Failure' }
    post:
      summary: Cria vampiro independente em rascunho
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CharacterDraft' }
      responses:
        "201": { description: Objeto character com revisão 1 e membershipStatus none. }
        default: { $ref: '#/components/responses/Failure' }
  /api/v1/me/characters/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Consulta ficha própria de vampiro ou humano
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Objeto character privado do responsável. }
        default: { $ref: '#/components/responses/Failure' }
    patch:
      summary: Atualiza nome e conceito com revisão otimista
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, revision]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                concept: { type: [string, 'null'], maxLength: 500 }
                revision: { type: integer, minimum: 1 }
      responses:
        "200": { description: Objeto character com revisão incrementada. }
        "409": { description: Revisão desatualizada; recarregar antes de salvar. }
        default: { $ref: '#/components/responses/Failure' }
  /api/v1/me/characters/{id}/humans:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lista humanos privados vinculados ao vampiro próprio
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }
      responses:
        "200": { description: Lista characters e nextOffset sem fichas de outros usuários. }
        default: { $ref: '#/components/responses/Failure' }
    post:
      summary: Cria humano privado vinculado ao vampiro próprio
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/CharacterDraft' }
      responses:
        "201": { description: Objeto character humano em rascunho privado. }
        default: { $ref: '#/components/responses/Failure' }
  /api/v1/me:
    get:
      operationId: getMe
      summary: Consulta o perfil da identidade autenticada
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          $ref: '#/components/responses/ProfileResult'
        "401":
          $ref: '#/components/responses/Failure'
        "405":
          $ref: '#/components/responses/Failure'
        "503":
          $ref: '#/components/responses/Failure'
  /api/v1/me/profile:
    put:
      operationId: putMyProfile
      summary: Cria ou atualiza o próprio perfil sem duplicar identidade
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Nome normalizado por trim, sem caracteres de controle.
                preferredView:
                  type: string
                  enum: [player, storyteller]
                  default: player
      responses:
        "200":
          $ref: '#/components/responses/ProfileResult'
        "401":
          $ref: '#/components/responses/Failure'
        "405":
          $ref: '#/components/responses/Failure'
        "422":
          $ref: '#/components/responses/Failure'
        "503":
          $ref: '#/components/responses/Failure'
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Verifica a disponibilidade da API
      tags: [Health]
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                required: [status, service, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    example: vtm-app-api
                  timestamp:
                    type: string
                    format: date-time
components:
  requestBodies:
    CharacterDraft:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              concept: { type: [string, 'null'], maxLength: 500 }
  /api/v1/profile:
    get:
      operationId: getOwnProfile
      summary: Consulta o perfil do usuário autenticado
      description: A identidade é obtida do subject do token Auth0 validado. Nunca aceita subject por parâmetro.
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil encontrado
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: O usuário autenticado ainda não criou perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createOwnProfile
      summary: Cria o perfil do usuário autenticado
      description: Criação única por subject Auth0. A repetição retorna 409 e não sobrescreve o perfil.
      tags: [Profile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Perfil criado
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Campos ausentes ou inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Perfil já existe para a identidade Auth0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Failure:
      description: Erro padronizado; 401 autenticação, 405 método, 422 entrada inválida, 503 serviço indisponível.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
    ProfileResult:
      description: Perfil atual; GET sem perfil retorna null. Resposta não armazenável em cache.
      content:
        application/json:
          schema:
            type: object
            required: [profile, profileRequired]
            properties:
              profileRequired: { type: boolean }
              profile:
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [id, displayName, preferredView, createdAt, updatedAt]
                    properties:
                      id: { type: string, format: uuid }
                      displayName: { type: string }
                      preferredView: { type: string, enum: [player, storyteller] }
                      createdAt: { type: string, format: date-time }
                      updatedAt: { type: string, format: date-time }
  schemas:
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required: [name, email, accountType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        nickname:
          type: string
          maxLength: 40
        pronouns:
          type: string
          maxLength: 60
        email:
          type: string
          format: email
          maxLength: 320
        accountType:
          type: string
          enum: [player, game_master, both]
    Profile:
      type: object
      required: [name, nickname, pronouns, email, accountType, createdAt, updatedAt]
      properties:
        name:
          type: string
        nickname:
          type: [string, "null"]
        pronouns:
          type: [string, "null"]
        email:
          type: string
          format: email
        accountType:
          type: string
          enum: [player, game_master, both]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Erro interno ou configuração de dependência ausente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
